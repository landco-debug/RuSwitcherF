name: macOS Build

on:
  push:
    branches:
      - main
      - feature/configurable-flag-size
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build universal app
        run: |
          cd macos
          RS_SIGN_ID="-" ./build_app.sh

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent macos/RuSwitcher.app RuSwitcherF-macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RuSwitcherF-macOS
          path: RuSwitcherF-macOS.zip
          if-no-files-found: error
